<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Browser</title>
    <style>
        :root {
            --color-background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --color-surface: rgba(255, 255, 255, 0.95);
            --color-text: rgba(30, 30, 60, 1);
            --color-text-secondary: rgba(100, 100, 130, 1);
            --color-primary: rgba(102, 126, 234, 1);
            --color-primary-hover: rgba(118, 75, 162, 1);
            --color-border: rgba(102, 126, 234, 0.3);
            --color-card-border: rgba(102, 126, 234, 0.2);
            --color-accent-1: #f093fb;
            --color-accent-2: #4facfe;
            --color-accent-3: #43e97b;
            --color-accent-4: #fa709a;
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-family-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --radius-base: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 2px 8px rgba(102, 126, 234, 0.15);
            --shadow-md: 0 8px 24px rgba(102, 126, 234, 0.25);
            --shadow-lg: 0 12px 32px rgba(102, 126, 234, 0.35);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                --color-surface: rgba(30, 30, 50, 0.95);
                --color-text: rgba(245, 245, 255, 1);
                --color-text-secondary: rgba(167, 169, 200, 0.8);
                --color-primary: rgba(240, 147, 251, 1);
                --color-primary-hover: rgba(79, 172, 254, 1);
                --color-border: rgba(240, 147, 251, 0.3);
                --color-card-border: rgba(240, 147, 251, 0.2);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-base);
            background: var(--color-background);
            background-attachment: fixed;
            color: var(--color-text);
            line-height: 1.6;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: white;
            text-shadow: 2px 2px 12px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .repo-info {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .repo-info a {
            color: rgba(255, 255, 255, 1);
            text-decoration: none;
            font-weight: 600;
        }

        .repo-info a:hover {
            text-decoration: underline;
        }

        .breadcrumb {
            background: var(--color-surface);
            padding: 1rem;
            border-radius: var(--radius-base);
            border: 2px solid transparent;
            background-image: linear-gradient(var(--color-surface), var(--color-surface)), 
                              linear-gradient(135deg, var(--color-accent-1), var(--color-accent-2));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            margin-bottom: 1rem;
            font-family: var(--font-family-mono);
            font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }

        .breadcrumb a {
            color: var(--color-primary);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .error {
            background: rgba(192, 21, 47, 0.1);
            color: rgba(192, 21, 47, 1);
            padding: 1rem;
            border-radius: var(--radius-base);
            border: 1px solid rgba(192, 21, 47, 0.25);
        }

        .file-list {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 2px solid transparent;
            background-image: linear-gradient(var(--color-surface), var(--color-surface)), 
                              linear-gradient(135deg, var(--color-accent-2), var(--color-accent-3));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--color-border);
            transition: background 0.2s;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background: linear-gradient(90deg, rgba(240, 147, 251, 0.1), rgba(79, 172, 254, 0.1));
        }

        @media (prefers-color-scheme: dark) {
            .file-item:hover {
                background: linear-gradient(90deg, rgba(240, 147, 251, 0.15), rgba(79, 172, 254, 0.15));
            }
        }

        .file-icon {
            width: 20px;
            height: 20px;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }

        .file-name {
            flex: 1;
            color: var(--color-text);
            text-decoration: none;
            font-family: var(--font-family-mono);
            font-size: 0.9rem;
        }

        .file-name:hover {
            color: var(--color-primary);
        }

        .file-size {
            color: var(--color-text-secondary);
            font-size: 0.85rem;
            margin-left: 1rem;
        }

        .back-button {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));
            color: white;
            text-decoration: none;
            border-radius: var(--radius-base);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .repo-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 2px solid transparent;
            background-image: linear-gradient(var(--color-surface), var(--color-surface)), 
                              linear-gradient(135deg, var(--color-accent-1), var(--color-accent-4));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            padding: 1.5rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .repo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.1), rgba(245, 87, 108, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .repo-card:hover::before {
            opacity: 1;
        }

        .repo-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .repo-card > * {
            position: relative;
            z-index: 1;
        }

        .repo-card-title {
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .repo-card-description {
            color: var(--color-text-secondary);
            margin-bottom: 1rem;
        }

        .repo-card-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }

        .repo-card-meta-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }

        .tooltip {
            position: fixed;
            background: var(--color-surface);
            border: 2px solid transparent;
            background-image: linear-gradient(var(--color-surface), var(--color-surface)), 
                              linear-gradient(135deg, var(--color-accent-3), var(--color-accent-2));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: var(--radius-base);
            padding: 1rem;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            font-size: 0.85rem;
            line-height: 1.5;
            display: none;
            pointer-events: none;
        }

        .tooltip.visible {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tooltip-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--color-accent-3), var(--color-accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1rem;
        }

        .tooltip-content {
            color: var(--color-text-secondary);
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .tooltip-content::-webkit-scrollbar {
            width: 6px;
        }

        .tooltip-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .tooltip-content::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--color-accent-3), var(--color-accent-2));
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="repo-name">Repository Browser</h1>
        <div class="repo-info">
            <span id="repo-description"></span>
            <a id="repo-link" href="" target="_blank" rel="noopener noreferrer"></a>
        </div>

        <div class="breadcrumb" id="breadcrumb"></div>

        <div id="content">
            <div class="loading">Loading repositories...</div>
        </div>
        
        <div id="tooltip" class="tooltip">
            <div class="tooltip-title">📄 README</div>
            <div class="tooltip-content" id="tooltip-content"></div>
        </div>
    </div>

    <script>
        const currentUrl = window.location.href;
        const pathParts = currentUrl.split('/');
        const githubIndex = pathParts.indexOf('github.io');
        
        let REPO_OWNER = 'jajohnsylvester';
        
        if (githubIndex !== -1) {
            REPO_OWNER = pathParts[githubIndex - 1].replace('https:', '').replace('//', '');
        }

        let currentRepo = null;
        let currentPath = '';
        let readmeCache = {};

        async function loadRepositories() {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<div class="loading">Loading repositories...</div>';

            try {
                const url = `https://api.github.com/users/${REPO_OWNER}/repos?per_page=100&sort=updated`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Failed to fetch repositories: ${response.statusText}`);
                }

                const repos = await response.json();
                
                const publicRepos = repos.filter(repo => !repo.private);

                document.getElementById('repo-name').textContent = `${REPO_OWNER}'s Repositories`;
                document.getElementById('repo-description').textContent = `${publicRepos.length} public repositories`;
                const repoLink = document.getElementById('repo-link');
                repoLink.href = `https://github.com/${REPO_OWNER}`;
                repoLink.textContent = 'View on GitHub →';

                displayRepositories(publicRepos);
                updateBreadcrumb(null, null);
            } catch (error) {
                contentDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function displayRepositories(repos) {
            const contentDiv = document.getElementById('content');
            
            let html = '<div class="repo-grid">';

            repos.forEach(repo => {
                const repoNameEscaped = repo.name.replace(/'/g, "\\'");
                html += `
                    <div class="repo-card" 
                         onclick="event.stopPropagation(); openRepository('${repoNameEscaped}')"
                         onmouseenter="showReadmeTooltip(event, '${repoNameEscaped}')"
                         onmouseleave="hideTooltip()"
                         onmousemove="updateTooltipPosition(event)">
                        <div class="repo-card-title">${repo.name}</div>
                        <div class="repo-card-description">${repo.description || 'No description'}</div>
                        <div class="repo-card-meta">
                            ${repo.language ? `<span class="repo-card-meta-item">📝 ${repo.language}</span>` : ''}
                            <span class="repo-card-meta-item">⭐ ${repo.stargazers_count}</span>
                            <span class="repo-card-meta-item">🔱 ${repo.forks_count}</span>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            contentDiv.innerHTML = html;
        }

        async function openRepository(repoName) {
            currentRepo = repoName;
            currentPath = '';
            await fetchRepoContents('');
        }

        async function fetchRepoContents(path = '') {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<div class="loading">Loading...</div>';

            try {
                const url = `https://api.github.com/repos/${REPO_OWNER}/${currentRepo}/contents/${path}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Failed to fetch repository contents: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (!path) {
                    const repoResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${currentRepo}`);
                    const repoData = await repoResponse.json();
                    
                    document.getElementById('repo-name').textContent = repoData.name;
                    document.getElementById('repo-description').textContent = repoData.description || '';
                    const repoLink = document.getElementById('repo-link');
                    repoLink.href = repoData.html_url;
                    repoLink.textContent = 'View on GitHub →';
                }

                displayContents(data, path);
                updateBreadcrumb(currentRepo, path);
            } catch (error) {
                contentDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function displayContents(items, path) {
            const contentDiv = document.getElementById('content');
            
            items.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'dir' ? -1 : 1;
            });

            let html = '<div class="file-list">';

            if (path) {
                html += `
                    <div class="file-item">
                        <svg class="file-icon" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0L6.59 1.41 12.17 7H0v2h12.17l-5.58 5.59L8 16l8-8z" transform="rotate(180 8 8)"/>
                        </svg>
                        <a href="#" class="file-name" onclick="goBack(); return false;">..</a>
                    </div>
                `;
            }

            items.forEach(item => {
                const icon = item.type === 'dir' ? getFolderIcon() : getFileIcon(item.name);
                const size = item.size ? formatBytes(item.size) : '';
                const pathEscaped = (item.path || '').replace(/'/g, "\\'");
                const downloadUrlEscaped = (item.download_url || '').replace(/'/g, "\\'");
                
                html += `
                    <div class="file-item">
                        ${icon}
                        <a href="#${item.path}" class="file-name" onclick="handleClick('${item.type}', '${pathEscaped}', '${downloadUrlEscaped}'); return false;">
                            ${item.name}
                        </a>
                        ${size ? `<span class="file-size">${size}</span>` : ''}
                    </div>
                `;
            });

            html += '</div>';
            contentDiv.innerHTML = html;
        }

        function handleClick(type, path, downloadUrl) {
            if (type === 'dir') {
                currentPath = path;
                fetchRepoContents(path);
            } else {
                window.open(downloadUrl, '_blank');
            }
        }

        function goBack() {
            const parts = currentPath.split('/');
            parts.pop();
            currentPath = parts.join('/');
            fetchRepoContents(currentPath);
        }

        function updateBreadcrumb(repo, path) {
            const breadcrumb = document.getElementById('breadcrumb');
            
            if (!repo) {
                breadcrumb.innerHTML = `<span>${REPO_OWNER}'s Repositories</span>`;
                return;
            }

            const parts = path ? path.split('/') : [];
            
            let html = `<a href="#" onclick="loadRepositories(); return false;">${REPO_OWNER}</a>`;
            html += ` / <a href="#" onclick="openRepository('${repo}'); return false;">${repo}</a>`;
            
            let pathSoFar = '';
            parts.forEach((part, index) => {
                pathSoFar += (index > 0 ? '/' : '') + part;
                const pathToNavigate = pathSoFar;
                html += ` / <a href="#${pathToNavigate}" onclick="fetchRepoContents('${pathToNavigate}'); return false;">${part}</a>`;
            });
            
            breadcrumb.innerHTML = html;
        }

        function getFolderIcon() {
            return `
                <svg class="file-icon" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M1.75 1A1.75 1.75 0 000 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0016 13.25v-8.5A1.75 1.75 0 0014.25 3H7.5a.25.25 0 01-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75z"/>
                </svg>
            `;
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const color = ext === 'html' ? '#e34c26' : 
                         ext === 'css' ? '#563d7c' : 
                         ext === 'js' ? '#f1e05a' : 
                         ext === 'md' ? '#083fa1' : 
                         'currentColor';
            
            return `
                <svg class="file-icon" viewBox="0 0 16 16" fill="${color}">
                    <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0113.25 16h-9.5A1.75 1.75 0 012 14.25V1.75z"/>
                </svg>
            `;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        let currentTooltipRepo = null;

        async function showReadmeTooltip(event, repoName) {
            currentTooltipRepo = repoName;
            const tooltip = document.getElementById('tooltip');
            const tooltipContent = document.getElementById('tooltip-content');
            
            // Check cache first
            if (readmeCache[repoName] !== undefined) {
                if (readmeCache[repoName] === null) {
                    return; // No README exists
                }
                tooltipContent.textContent = readmeCache[repoName];
                positionTooltip(event);
                tooltip.classList.add('visible');
                return;
            }

            // Try to fetch README
            try {
                const readmeVariants = ['README.txt', 'Readme.txt', 'readme.txt', 'README.md', 'Readme.md', 'readme.md', 'README'];
                let readmeContent = null;

                for (const variant of readmeVariants) {
                    try {
                        const url = `https://api.github.com/repos/${REPO_OWNER}/${repoName}/contents/${variant}`;
                        const response = await fetch(url);
                        
                        if (response.ok) {
                            const data = await response.json();
                            const content = atob(data.content);
                            readmeContent = content;
                            break;
                        }
                    } catch (e) {
                        continue;
                    }
                }

                if (readmeContent && currentTooltipRepo === repoName) {
                    // Limit content length for tooltip
                    const maxLength = 500;
                    const displayContent = readmeContent.length > maxLength 
                        ? readmeContent.substring(0, maxLength) + '...' 
                        : readmeContent;
                    
                    readmeCache[repoName] = displayContent;
                    tooltipContent.textContent = displayContent;
                    positionTooltip(event);
                    tooltip.classList.add('visible');
                } else {
                    readmeCache[repoName] = null; // Mark as no README
                }
            } catch (error) {
                readmeCache[repoName] = null;
            }
        }

        function positionTooltip(event) {
            const tooltip = document.getElementById('tooltip');
            const offset = 15;
            
            tooltip.style.left = (event.clientX + offset) + 'px';
            tooltip.style.top = (event.clientY + offset) + 'px';
            
            // Check if tooltip goes off screen and adjust
            setTimeout(() => {
                const tooltipRect = tooltip.getBoundingClientRect();
                if (tooltipRect.right > window.innerWidth) {
                    tooltip.style.left = (event.clientX - tooltipRect.width - offset) + 'px';
                }
                if (tooltipRect.bottom > window.innerHeight) {
                    tooltip.style.top = (event.clientY - tooltipRect.height - offset) + 'px';
                }
            }, 0);
        }

        function updateTooltipPosition(event) {
            const tooltip = document.getElementById('tooltip');
            if (tooltip.classList.contains('visible')) {
                positionTooltip(event);
            }
        }

        function hideTooltip() {
            currentTooltipRepo = null;
            const tooltip = document.getElementById('tooltip');
            tooltip.classList.remove('visible');
        }

        if (REPO_OWNER) {
            loadRepositories();
        } else {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <p><strong>Configuration Required</strong></p>
                    <p>Unable to detect repository owner from URL. Please ensure you're accessing this from a GitHub Pages URL.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
