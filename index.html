<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jajohnsylvester - Repositories</title>
    <style>
        :root {
            /* Color Palette - Modern & Clean */
            --bg-body: #f6f8fa;
            --bg-card: #ffffff;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --accent-primary: #0969da;
            --accent-hover: #0a469a;
            --border-color: #d0d7de;
            --code-bg: #f6f8fa;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-hover: 0 8px 24px rgba(149, 157, 165, 0.2);
            
            /* Language Colors */
            --lang-js: #f1e05a;
            --lang-html: #e34c26;
            --lang-css: #563d7c;
            --lang-python: #3572A5;
            --lang-other: #8b949e;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0d1117;
                --bg-card: #161b22;
                --text-primary: #c9d1d9;
                --text-secondary: #8b949e;
                --accent-primary: #58a6ff;
                --accent-hover: #79c0ff;
                --border-color: #30363d;
                --code-bg: #161b22;
                --shadow-card: 0 1px 3px rgba(0,0,0,0.5);
                --shadow-hover: 0 8px 24px rgba(0,0,0,0.5);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
        }

        h1 { font-size: 1.8rem; font-weight: 600; }
        .subtitle { color: var(--text-secondary); font-size: 0.95rem; }

        /* Navigation */
        .breadcrumb {
            background: var(--bg-card);
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .breadcrumb a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb span { color: var(--text-secondary); }

        /* Grid for Repositories */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .repo-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-card);
        }

        .repo-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-primary);
        }

        .repo-title {
            font-weight: 600;
            color: var(--accent-primary);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .repo-desc {
            color: var(--text-secondary);
            font-size: 0.85rem;
            flex-grow: 1;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .repo-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: auto;
        }

        .lang-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        /* File List Styles */
        .file-list {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.1s;
            cursor: pointer;
        }

        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background-color: rgba(0,0,0,0.03); }

        .file-icon {
            width: 20px;
            height: 20px;
            margin-right: 0.8rem;
            color: var(--text-secondary);
        }
        .folder-icon { color: #54aeff; fill: currentColor; }

        .file-name {
            flex: 1;
            color: var(--text-primary);
            text-decoration: none;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.9rem;
        }
        .file-item:hover .file-name { color: var(--accent-primary); }

        .file-size { font-size: 0.8rem; color: var(--text-secondary); }

        /* File Content Viewer */
        .file-viewer {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        
        .viewer-header {
            padding: 0.8rem 1rem;
            background: var(--bg-body);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .btn-back {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-back:hover { background-color: rgba(0,0,0,0.05); }

        .code-block {
            padding: 1rem;
            margin: 0;
            overflow-x: auto;
            background: var(--code-bg);
            color: var(--text-primary);
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }

        /* Media Viewer Styles */
        .media-container {
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .media-container video {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 4px;
        }

        /* PDF Viewer Styles */
        .pdf-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            background: var(--bg-body);
            border-bottom: 1px solid var(--border-color);
            justify-content: center;
        }

        .pdf-controls button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .pdf-controls button:hover {
            background-color: rgba(0,0,0,0.05);
        }

        .pdf-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pdf-canvas-container {
            padding: 1rem;
            overflow: auto;
            max-height: 75vh;
            display: flex;
            justify-content: center;
            background: var(--bg-body);
        }

        #pdf-canvas {
            max-width: 100%;
            height: auto;
            box-shadow: var(--shadow-hover);
        }

        .notebook-container {
            padding: 1rem;
            overflow-x: auto;
        }

        .notebook-cell {
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .notebook-cell-type {
            padding: 0.5rem 1rem;
            background: var(--bg-body);
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
        }

        .notebook-cell-content {
            padding: 1rem;
            background: var(--bg-card);
        }

        .notebook-cell-content pre {
            margin: 0;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.9rem;
        }

        /* Markdown Viewer Styles */
        .markdown-content {
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .markdown-content h1 {
            font-size: 2rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3rem;
        }

        .markdown-content h2 {
            font-size: 1.5rem;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3rem;
        }

        .markdown-content h3 {
            font-size: 1.25rem;
            margin-top: 1.2rem;
            margin-bottom: 0.6rem;
        }

        .markdown-content h4, .markdown-content h5, .markdown-content h6 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .markdown-content p {
            margin-bottom: 1rem;
        }

        .markdown-content ul, .markdown-content ol {
            margin-bottom: 1rem;
            padding-left: 2rem;
        }

        .markdown-content li {
            margin-bottom: 0.25rem;
        }

        .markdown-content pre {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        .markdown-content code {
            background: var(--code-bg);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.9em;
        }

        .markdown-content pre code {
            background: transparent;
            padding: 0;
        }

        .markdown-content blockquote {
            border-left: 4px solid var(--border-color);
            padding-left: 1rem;
            margin: 1rem 0;
            color: var(--text-secondary);
        }

        .markdown-content a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        .markdown-content a:hover {
            text-decoration: underline;
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 1rem 0;
        }

        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1rem;
        }

        .markdown-content table th,
        .markdown-content table td {
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            text-align: left;
        }

        .markdown-content table th {
            background: var(--bg-body);
            font-weight: 600;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 2rem 0;
        }

        /* Utilities */
        .loading { padding: 3rem; text-align: center; color: var(--text-secondary); }
        .error { 
            background: rgba(207, 34, 46, 0.1); 
            color: #cf222e; 
            padding: 1rem; 
            border-radius: 6px; 
            border: 1px solid rgba(207, 34, 46, 0.2); 
            text-align: center;
        }
    </style>
</head>

            html: `<svg class="file-icon" viewBox="0 0 16 16" style="color: #e34c26;"><path fill="currentColor" d="M1 2.5A1.5 1.5 0 012.5 1h11A1.5 1.5 0 0115 2.5v11a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 011 13.5v-11zm1.5-.5a.5.5 0 00-.5.5v11a.5.5 0 00.5.5h11a.5.5 0 00.5-.5v-11a.5.5 0 00-.5-.5h-11z"></path><path fill="currentColor" d="M5.854 7.854a.5.5 0 01-.708-.708l1.5-1.5a.5.5 0 01.708 0l1.5 1.5a.5.5 0 01-.708.708L7.5 7.207 6.854 7.854zm3.292 0a.5.5 0 01.708-.708l1.5 1.5a.5.5 0 01-.708.708L10 8.707l-.854.147z"></path></svg>`,
            css: `<svg class="file-icon" viewBox="0 0 16 16" style="color: #563d7c;"><path fill="currentColor" d="M1.5 2.5A1.5 1.5 0 013 1h10a1.5 1.5 0 011.5 1.5v11A1.5 1.5 0 0113 15H3a1.5 1.5 0 01-1.5-1.5v-11zM3 2a.5.5 0 00-.5.5v11a.5.5 0 00.5.5h10a.5.5 0 00.5-.5v-11A.5.5 0 0013 2H3z"></path><path fill="currentColor" d="M5.5 5a.5.5 0 00-.5.5v2a.5.5 0 001 0v-2a.5.5 0 00-.5-.5zm3 0a.5.5 0 00-.5.5v5a.5.5 0 001 0v-5a.5.5 0 00-.5-.5zm2.5.5a.5.5 0 011 0v5a.5.5 0 01-1 0v-5z"></path></svg>`
        };

        // File icon mapping
        function getFileIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            const name = fileName.toLowerCase();
            
            // Code files
            if (['js', 'jsx', 'ts', 'tsx', 'mjs'].includes(ext)) return ICONS.javascript;
            if (['py', 'pyw', 'pyc'].includes(ext)) return ICONS.python;
            if (['html', 'htm'].includes(ext)) return ICONS.html;
            if (['css', 'scss', 'sass', 'less'].includes(ext)) return ICONS.css;
            if (['json', 'jsonc'].includes(ext)) return ICONS.json;
            if (['java', 'c', 'cpp', 'h', 'hpp', 'cs', 'php', 'rb', 'go', 'rs', 'swift', 'kt', 'scala'].includes(ext)) return ICONS.code;
            
            // Markdown
            if (['md', 'markdown'].includes(ext)) return ICONS.markdown;
            
            // Documents
            if (['pdf'].includes(ext)) return ICONS.pdf;
            if (['doc', 'docx', 'odt', 'rtf', 'txt'].includes(ext)) return ICONS.document;
            
            // Images
            if (['png', 'jpg', 'jpeg', 'gif', 'bmp', 'svg', 'ico', 'webp'].includes(ext)) return ICONS.image;
            
            // Videos
            if (['mp4', 'webm', 'ogg', 'avi', 'mov', 'mkv'].includes(ext)) return ICONS.video;
            
            // Archives
            if (['zip', 'tar', 'gz', 'rar', '7z', 'bz2'].includes(ext)) return ICONS.archive;
            
            // Config files
            if (['yml', 'yaml', 'toml', 'ini', 'env', 'config', 'conf'].includes(ext)) return ICONS.config;
            if (name.startsWith('.') || ['gitignore', 'dockerignore', 'npmignore'].includes(name)) return ICONS.config;
            
            // Notebooks
            if (ext === 'ipynb') return ICONS.code;
            
            // Default
            return ICONS.file;
        }

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('page-title').textContent = REPO_OWNER;
            fetchRepos();
        });

        // --- API FUNCTIONS ---

        async function fetchRepos() {
            renderLoading();
            currentRepo = null;
            currentPath = '';
            isViewingFile = false;
            
            try {
                const res = await fetch(`https://api.github.com/users/${REPO_OWNER}/repos?sort=updated&per_page=100`);
                if (!res.ok) throw new Error('Failed to load repositories');
                
                const repos = await res.json();
                
                if(repos.length > 0) document.getElementById('avatar').src = repos[0].owner.avatar_url;
                
                renderRepoList(repos);
                updateBreadcrumb();
            } catch (err) {
                renderError(err.message);
            }
        }

        async function fetchContents(repoName, path = '') {
            renderLoading();
            currentRepo = repoName;
            currentPath = path;
            isViewingFile = false;

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${repoName}/contents/${path}`);
                if (!res.ok) throw new Error(`Could not access content.`);
                
                const data = await res.json();
                renderFileList(data);
                updateBreadcrumb();
            } catch (err) {
                renderError(err.message);
            }
        }

        async function viewFile(fileName, downloadUrl) {
            renderLoading();
            isViewingFile = true;
            
            const ext = fileName.split('.').pop().toLowerCase();
            
            // Handle different file types
            if (ext === 'mp4' || ext === 'webm' || ext === 'ogg') {
                renderVideoViewer(fileName, downloadUrl);
            } else if (ext === 'pdf') {
                renderPDFViewer(fileName, downloadUrl);
            } else if (ext === 'docx' || ext === 'doc') {
                renderWordDocument(fileName, downloadUrl);
            } else if (ext === 'ipynb') {
                renderNotebook(fileName, downloadUrl);
            } else if (ext === 'md') {
                renderMarkdown(fileName, downloadUrl);
            } else {
                // Text files
                const viewable = ['txt', 'js', 'html', 'css', 'json', 'py', 'java', 'c', 'cpp', 'xml', 'yml', 'yaml', 'sh', 'gitignore', 'ts', 'jsx', 'tsx', 'rs', 'go', 'rb'];
                
                if (!viewable.includes(ext) && !fileName.toLowerCase().startsWith('license')) {
                    window.open(downloadUrl, '_blank');
                    goBack();
                    return;
                }

                try {
                    const res = await fetch(downloadUrl);
                    if(!res.ok) throw new Error("Failed to fetch file content");
                    const text = await res.text();
                    
                    renderFileContent(fileName, text);
                } catch(err) {
                    renderError("Could not display file. " + err.message);
                }
            }
        }

        // --- RENDER FUNCTIONS ---

        function renderRepoList(repos) {
            const container = document.getElementById('content');
            if (repos.length === 0) {
                container.innerHTML = '<div class="error">No public repositories found.</div>';
                return;
            }

            let html = '<div class="repo-grid">';
            
            repos.forEach(repo => {
                const langColor = colors[repo.language] || '#8b949e';
                const langHtml = repo.language 
                    ? `<span style="display:flex; align-items:center;"><span class="lang-dot" style="background:${langColor}"></span>${repo.language}</span>` 
                    : '';
                
                html += `
                    <div class="repo-card" onclick="fetchContents('${repo.name}')">
                        <div class="repo-title">${repo.name}</div>
                        <div class="repo-desc">${repo.description || 'No description provided.'}</div>
                        <div class="repo-meta">
                            ${langHtml}
                            <span>Last updated: ${new Date(repo.updated_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function renderFileList(items) {
            const container = document.getElementById('content');
            
            const sorted = Array.isArray(items) ? items.sort((a,b) => (a.type === b.type ? 0 : a.type === 'dir' ? -1 : 1)) : [items];

            let html = '<div class="file-list">';

            html += `
                <div class="file-item" onclick="goBack()">
                    ${ICONS.back}
                    <span class="file-name">..</span>
                </div>
            `;

            sorted.forEach(item => {
                const isDir = item.type === 'dir';
                const icon = isDir ? ICONS.folder : getFileIcon(item.name);
                
                const action = isDir 
                    ? `fetchContents('${currentRepo}', '${item.path}')` 
                    : `viewFile('${item.name}', '${item.download_url}')`;

                html += `
                    <div class="file-item" onclick="${action}">
                        ${icon}
                        <span class="file-name">${item.name}</span>
                        <span class="file-size">${item.size ? formatBytes(item.size) : ''}</span>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        function renderFileContent(fileName, content) {
            const container = document.getElementById('content');
            
            const safeContent = content.replace(/&/g, "&amp;")
                                       .replace(/</g, "&lt;")
                                       .replace(/>/g, "&gt;")
                                       .replace(/"/g, "&quot;")
                                       .replace(/'/g, "&#039;");

            const html = `
                <div class="file-viewer">
                    <div class="viewer-header">
                        <strong>${fileName}</strong>
                        <button class="btn-back" onclick="goBack()">Back</button>
                    </div>
                    <pre class="code-block"><code>${safeContent}</code></pre>
                </div>
            `;
            container.innerHTML = html;
        }

        function renderVideoViewer(fileName, url) {
            const container = document.getElementById('content');
            const html = `
                <div class="file-viewer">
                    <div class="viewer-header">
                        <strong>${fileName}</strong>
                        <button class="btn-back" onclick="goBack()">Back</button>
                    </div>
                    <div class="media-container">
                        <video controls>
                            <source src="${url}" type="video/${fileName.split('.').pop()}">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        async function renderPDFViewer(fileName, url) {
            const container = document.getElementById('content');
            
            // Create initial HTML structure
            container.innerHTML = `
                <div class="file-viewer">
                    <div class="viewer-header">
                        <strong>${fileName}</strong>
                        <button class="btn-back" onclick="goBack()">Back</button>
                    </div>
                    <div class="pdf-controls">
                        <button id="pdf-prev">Previous</button>
                        <span>Page: <span id="pdf-page-num">1</span> / <span id="pdf-page-count">--</span></span>
                        <button id="pdf-next">Next</button>
                    </div>
                    <div class="pdf-canvas-container">
                        <canvas id="pdf-canvas"></canvas>
                    </div>
                </div>
            `;

            try {
                // Fetch PDF
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                
                // Load PDF document
                pdfDoc = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                document.getElementById('pdf-page-count').textContent = pdfDoc.numPages;
                
                // Set up controls
                document.getElementById('pdf-prev').addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage--;
                        renderPDFPage(currentPage);
                    }
                });
                
                document.getElementById('pdf-next').addEventListener('click', () => {
                    if (currentPage < pdfDoc.numPages) {
                        currentPage++;
                        renderPDFPage(currentPage);
                    }
                });
                
                // Render first page
                currentPage = 1;
                renderPDFPage(currentPage);
                
            } catch (err) {
                renderError("Could not load PDF. " + err.message);
            }
        }

        async function renderPDFPage(pageNum) {
            const page = await pdfDoc.getPage(pageNum);
            const canvas = document.getElementById('pdf-canvas');
            const ctx = canvas.getContext('2d');
            
            // Set scale for better quality
            const viewport = page.getViewport({scale: 1.5});
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            
            // Render page
            await page.render({
                canvasContext: ctx,
                viewport: viewport
            }).promise;
            
            // Update page number
            document.getElementById('pdf-page-num').textContent = pageNum;
            
            // Update button states
            document.getElementById('pdf-prev').disabled = (pageNum <= 1);
            document.getElementById('pdf-next').disabled = (pageNum >= pdfDoc.numPages);
        }

        async function renderWordDocument(fileName, url) {
            const container = document.getElementById('content');
            
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                
                const result = await mammoth.convertToHtml({arrayBuffer: arrayBuffer});
                
                const html = `
                    <div class="file-viewer">
                        <div class="viewer-header">
                            <strong>${fileName}</strong>
                            <button class="btn-back" onclick="goBack()">Back</button>
                        </div>
                        <div class="media-container" style="display: block; text-align: left;">
                            <div style="max-width: 800px; margin: 0 auto; padding: 2rem; background: white; color: black; border-radius: 4px;">
                                ${result.value}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            } catch (err) {
                renderError("Could not display Word document. " + err.message);
            }
        }

        async function renderNotebook(fileName, url) {
            const container = document.getElementById('content');
            
            try {
                const response = await fetch(url);
                const notebook = await response.json();
                
                let cellsHtml = '';
                
                if (notebook.cells && Array.isArray(notebook.cells)) {
                    notebook.cells.forEach(cell => {
                        const cellType = cell.cell_type;
                        const source = Array.isArray(cell.source) ? cell.source.join('') : cell.source;
                        
                        let contentHtml = '';
                        
                        if (cellType === 'markdown') {
                            contentHtml = `<div>${source.replace(/\n/g, '<br>')}</div>`;
                        } else if (cellType === 'code') {
                            const safeCode = source.replace(/&/g, "&amp;")
                                                  .replace(/</g, "&lt;")
                                                  .replace(/>/g, "&gt;");
                            contentHtml = `<pre>${safeCode}</pre>`;
                            
                            // Add outputs if available
                            if (cell.outputs && cell.outputs.length > 0) {
                                contentHtml += '<div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">';
                                cell.outputs.forEach(output => {
                                    if (output.text) {
                                        const outText = Array.isArray(output.text) ? output.text.join('') : output.text;
                                        contentHtml += `<pre style="color: var(--text-secondary);">${outText}</pre>`;
                                    }
                                });
                                contentHtml += '</div>';
                            }
                        }
                        
                        cellsHtml += `
                            <div class="notebook-cell">
                                <div class="notebook-cell-type">${cellType}</div>
                                <div class="notebook-cell-content">${contentHtml}</div>
                            </div>
                        `;
                    });
                }
                
                const html = `
                    <div class="file-viewer">
                        <div class="viewer-header">
                            <strong>${fileName}</strong>
                            <button class="btn-back" onclick="goBack()">Back</button>
                        </div>
                        <div class="notebook-container">
                            ${cellsHtml}
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            } catch (err) {
                renderError("Could not display notebook. " + err.message);
            }
        }

        async function renderMarkdown(fileName, url) {
            const container = document.getElementById('content');
            
            try {
                const response = await fetch(url);
                const markdownText = await response.text();
                
                // Configure marked for better rendering
                marked.setOptions({
                    breaks: true,
                    gfm: true
                });
                
                // Convert markdown to HTML
                const htmlContent = marked.parse(markdownText);
                
                const html = `
                    <div class="file-viewer">
                        <div class="viewer-header">
                            <strong>${fileName}</strong>
                            <button class="btn-back" onclick="goBack()">Back</button>
                        </div>
                        <div class="markdown-content">
                            ${htmlContent}
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            } catch (err) {
                renderError("Could not display markdown file. " + err.message);
            }
        }

        // --- UTILS ---

        function goBack() {
            if (isViewingFile) {
                fetchContents(currentRepo, currentPath);
            } else if (!currentPath) {
                fetchRepos(); 
            } else {
                const parts = currentPath.split('/');
                parts.pop();
                fetchContents(currentRepo, parts.join('/'));
            }
        }

        function updateBreadcrumb() {
            const b = document.getElementById('breadcrumb');
            let html = `<a href="#" onclick="fetchRepos(); return false;">Home</a>`;
            
            if (currentRepo) {
                html += ` <span>/</span> <a href="#" onclick="fetchContents('${currentRepo}',''); return false;">${currentRepo}</a>`;
                
                if (currentPath) {
                    const parts = currentPath.split('/');
                    let build = '';
                    parts.forEach(p => {
                        build += (build ? '/' : '') + p;
                        html += ` <span>/</span> <span style="color:var(--text-secondary)">${p}</span>`;
                    });
                }
            }
            b.innerHTML = html;
        }

        function renderLoading() {
            document.getElementById('content').innerHTML = '<div class="loading">Loading...</div>';
        }

        function renderError(msg) {
            document.getElementById('content').innerHTML = `<div class="error">${msg}</div>`;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return parseFloat((bytes / Math.pow(1024, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
