<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositories for jajohnsylvester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292e;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1012px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #24292f;
        }

        #loading {
            text-align: center;
            font-size: 1.2em;
            color: #586069;
        }

        #error {
            text-align: center;
            color: #cb2431;
            display: none;
            padding: 20px;
            background: #ffeef0;
            border-radius: 6px;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .repo-card {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 16px;
            transition: box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .repo-card:hover {
            box-shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
        }

        .repo-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .repo-name a {
            color: #0366d6;
            text-decoration: none;
        }

        .repo-name a:hover {
            text-decoration: underline;
        }

        .repo-desc {
            font-size: 14px;
            color: #586069;
            margin-bottom: 16px;
            flex-grow: 1;
            line-height: 1.5;
        }

        .repo-meta {
            font-size: 12px;
            color: #586069;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: auto;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .language-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            background-color: #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Public Repositories for jajohnsylvester</h1>
    <div id="loading">Loading repositories...</div>
    <div id="error"></div>
    <div id="repo-list" class="repo-grid"></div>
</div>

<script>
    const USERNAME = 'jajohnsylvester';
    const API_URL = `https://api.github.com/users/${USERNAME}/repos`;

    // Function to fetch all pages of repositories
    async function fetchAllRepos() {
        let repos = [];
        let page = 1;
        const perPage = 100; // Max allowed by GitHub API per request

        try {
            while (true) {
                const response = await fetch(`${API_URL}?page=${page}&per_page=${perPage}&sort=updated`);
                
                if (!response.ok) {
                    if (response.status === 404) throw new Error("User not found.");
                    if (response.status === 403) throw new Error("API Rate limit exceeded. Please try again later.");
                    throw new Error(`GitHub API Error: ${response.statusText}`);
                }

                const data = await response.json();
                if (data.length === 0) break;

                repos = repos.concat(data);
                if (data.length < perPage) break; // We've reached the last page
                page++;
            }
            return repos;
        } catch (error) {
            throw error;
        }
    }

    // Function to render repositories
    function renderRepos(repos) {
        const container = document.getElementById('repo-list');
        const loading = document.getElementById('loading');
        
        loading.style.display = 'none';

        if (repos.length === 0) {
            container.innerHTML = '<p style="text-align:center; width:100%;">No public repositories found.</p>';
            return;
        }

        repos.forEach(repo => {
            const card = document.createElement('div');
            card.className = 'repo-card';

            // Language color mapping (simplified)
            const langColor = repo.language ? '#2188ff' : '#ccc'; 

            card.innerHTML = `
                <div class="repo-name">
                    <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                </div>
                <div class="repo-desc">
                    ${repo.description || 'No description provided.'}
                </div>
                <div class="repo-meta">
                    ${repo.language ? `
                        <span class="meta-item">
                            <span class="language-dot" style="background-color: ${langColor}"></span>
                            ${repo.language}
                        </span>
                    ` : ''}
                    <span class="meta-item">
                        ★ ${repo.stargazers_count}
                    </span>
                    <span class="meta-item">
                         ⑂ ${repo.forks_count}
                    </span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Initialize
    fetchAllRepos()
        .then(repos => renderRepos(repos))
        .catch(err => {
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            loading.style.display = 'none';
            errorDiv.style.display = 'block';
            errorDiv.textContent = err.message;
        });
</script>

</body>
</html>
