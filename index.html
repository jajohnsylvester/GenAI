<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jajohnsylvester - Repositories</title>
    <style>
        :root {
            --color-background: rgba(252, 252, 249, 1);
            --color-surface: rgba(255, 255, 253, 1);
            --color-text: rgba(19, 52, 59, 1);
            --color-text-secondary: rgba(98, 108, 113, 1);
            --color-primary: rgba(33, 128, 141, 1);
            --color-primary-hover: rgba(29, 116, 128, 1);
            --color-border: rgba(94, 82, 64, 0.2);
            --color-card-border: rgba(94, 82, 64, 0.12);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-family-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --radius-base: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: rgba(31, 33, 33, 1);
                --color-surface: rgba(38, 40, 40, 1);
                --color-text: rgba(245, 245, 245, 1);
                --color-text-secondary: rgba(167, 169, 169, 0.7);
                --color-primary: rgba(50, 184, 198, 1);
                --color-primary-hover: rgba(45, 166, 178, 1);
                --color-border: rgba(119, 124, 124, 0.3);
                --color-card-border: rgba(119, 124, 124, 0.2);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-text);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 { font-size: 2rem; font-weight: 600; margin-bottom: 0.5rem; }

        .repo-info { color: var(--color-text-secondary); margin-bottom: 2rem; font-size: 0.95rem; }
        .repo-info a { color: var(--color-primary); text-decoration: none; }
        .repo-info a:hover { text-decoration: underline; }

        .breadcrumb {
            background: var(--color-surface);
            padding: 1rem;
            border-radius: var(--radius-base);
            border: 1px solid var(--color-card-border);
            margin-bottom: 1rem;
            font-family: var(--font-family-mono);
            font-size: 0.9rem;
        }
        .breadcrumb a { color: var(--color-primary); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        .loading { text-align: center; padding: 3rem; color: var(--color-text-secondary); }

        .error {
            background: rgba(192, 21, 47, 0.1);
            color: #c0152f;
            padding: 1rem;
            border-radius: var(--radius-base);
            border: 1px solid rgba(192, 21, 47, 0.25);
            margin-top: 1rem;
        }

        .file-list {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-card-border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--color-border);
            transition: background 0.2s;
        }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: rgba(0, 0, 0, 0.02); }
