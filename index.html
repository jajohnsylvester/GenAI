<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jajohnsylvester - Repositories</title>
    <style>
        :root {
            --color-background: rgba(252, 252, 249, 1);
            --color-surface: rgba(255, 255, 253, 1);
            --color-text: rgba(19, 52, 59, 1);
            --color-text-secondary: rgba(98, 108, 113, 1);
            --color-primary: rgba(33, 128, 141, 1);
            --color-primary-hover: rgba(29, 116, 128, 1);
            --color-border: rgba(94, 82, 64, 0.2);
            --color-card-border: rgba(94, 82, 64, 0.12);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-family-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --radius-base: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: rgba(31, 33, 33, 1);
                --color-surface: rgba(38, 40, 40, 1);
                --color-text: rgba(245, 245, 245, 1);
                --color-text-secondary: rgba(167, 169, 169, 0.7);
                --color-primary: rgba(50, 184, 198, 1);
                --color-primary-hover: rgba(45, 166, 178, 1);
                --color-border: rgba(119, 124, 124, 0.3);
                --color-card-border: rgba(119, 124, 124, 0.2);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-text);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .repo-info {
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .repo-info a {
            color: var(--color-primary);
            text-decoration: none;
        }

        .repo-info a:hover {
            text-decoration: underline;
        }

        .breadcrumb {
            background: var(--color-surface);
            padding: 1rem;
            border-radius: var(--radius-base);
            border: 1px solid var(--color-card-border);
            margin-bottom: 1rem;
            font-family: var(--font-family-mono);
            font-size: 0.9rem;
        }

        .breadcrumb a {
            color: var(--color-primary);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--color-text-secondary);
        }

        .error {
            background: rgba(192, 21, 47, 0.1);
            color: rgba(192, 21, 47, 1);
            padding: 1rem;
            border-radius: var(--radius-base);
            border: 1px solid rgba(192, 21, 47, 0.25);
        }

        .file-list {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-card-border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--color-border);
            transition: background 0.2s;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        @media (prefers-color-scheme: dark) {
            .file-item:hover {
                background: rgba(255, 255, 255, 0.05);
            }
        }

        .file-icon {
            width: 20px;
            height: 20px;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }

        .file-name {
            flex: 1;
            color: var(--color-text);
            text-decoration: none;
            font-family: var(--font-family-mono);
            font-size: 0.9rem;
        }

        .file-name:hover {
            color: var(--color-primary);
        }

        .file-size {
            color: var(--color-text-secondary);
            font-size: 0.85rem;
            margin-left: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="repo-name">Repositories</h1>
        <div class="repo-info">
            <span id="repo-description"></span>
            <a id="repo-link" href="" target="_blank" rel="noopener noreferrer"></a>
        </div>

        <div class="breadcrumb" id="breadcrumb"></div>

        <div id="content">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'jajohnsylvester';
        let currentRepo = null; // Null means we are viewing the repo list
        let currentPath = '';

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            fetchRepositories();
        });

        // 1. Fetch List of Repositories
        async function fetchRepositories() {
            currentRepo = null;
            currentPath = '';
            
            // UI Updates for User Profile View
            document.getElementById('repo-name').textContent = REPO_OWNER;
            document.getElementById('repo-description').textContent = 'Public Repositories';
            const repoLink = document.getElementById('repo-link');
            repoLink.href = `https://github.com/${REPO_OWNER}`;
            repoLink.textContent = 'View Profile on GitHub →';
            
            updateBreadcrumb();
            
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<div class="loading">Loading repositories...</div>';

            try {
                // Get repos sorted by last updated
                const url = `https://api.github.com/users/${REPO_OWNER}/repos?sort=updated&per_page=100`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Failed to fetch repositories: ${response.statusText}`);
                }

                const repos = await response.json();
                displayRepositories(repos);
            } catch (error) {
                contentDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        // 2. Display List of Repositories
        function displayRepositories(repos) {
            const contentDiv = document.getElementById('content');
            
            if (repos.length === 0) {
                contentDiv.innerHTML = '<div class="loading">No public repositories found.</div>';
                return;
            }

            let html = '<div class="file-list">';

            repos.forEach(repo => {
                const icon = getRepoIcon();
                const language = repo.language ? repo.language : '';
                
                html += `
                    <div class="file-item">
                        ${icon}
                        <a href="#" class="file-name" onclick="enterRepo('${repo.name}', '${repo.description || ''}', '${repo.html_url}'); return false;">
                            ${repo.name}
                        </a>
                        ${language ? `<span class="file-size">${language}</span>` : ''}
                    </div>
                `;
            });

            html += '</div>';
            contentDiv.innerHTML = html;
        }

        // 3. Enter a specific Repository
        function enterRepo(repoName, description, htmlUrl) {
            currentRepo = repoName;
            currentPath = '';
            
            // Update Header for Repo View
            document.getElementById('repo-name').textContent = repoName;
            document.getElementById('repo-description').textContent = description;
            const repoLink = document.getElementById('repo-link');
            repoLink.href = htmlUrl;
            repoLink.textContent = 'View on GitHub →';
            
            fetchRepoContents('');
        }

        // 4. Fetch Contents of a Repository (File Browser)
        async function fetchRepoContents(path = '') {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<div class="loading">Loading...</div>';
            currentPath = path;

            updateBreadcrumb();

            try {
                const url = `https://api.github.com/repos/${REPO_OWNER}/${currentRepo}/contents/${path}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Failed to fetch contents: ${response.statusText}`);
                }

                const data = await response.json();
                displayContents(Array.isArray(data) ? data : [data]);
            } catch (error) {
                contentDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        // 5. Display Files/Folders
        function displayContents(items) {
            const contentDiv = document.getElementById('content');
            
            // Sort: directories first, then files
            items.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'dir' ? -1 : 1;
            });

            let html = '<div class="file-list">';

            // Logic for ".." (Back) button
            // If currentPath is empty, ".." goes back to Repo List. 
            // If currentPath is not empty, ".." goes to parent folder.
            html += `
                <div class="file-item">
                    <svg class="file-icon" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0L6.59 1.41 12.17 7H0v2h12.17l-5.58 5.59L8 16l8-8z" transform="rotate(180 8 8)"/>
                    </svg>
                    <a href="#" class="file-name" onclick="goBack(); return false;">..</a>
                </div>
            `;

            items.forEach(item => {
                const icon = item.type === 'dir' ? getFolderIcon() : getFileIcon(item.name);
                const size = item.size ? formatBytes(item.size) : '';
                
                html += `
                    <div class="file-item">
                        ${icon}
                        <a href="#${item.path}" class="file-name" onclick="handleItemClick('${item.type}', '${item.path}', '${item.download_url || ''}'); return false;">
                            ${item.name}
                        </a>
                        ${size ? `<span class="file-size">${size}</span>` : ''}
                    </div>
                `;
            });

            html += '</div>';
            contentDiv.innerHTML = html;
        }

        function handleItemClick(type, path, downloadUrl) {
            if (type === 'dir') {
                fetchRepoContents(path);
            } else {
                window.open(downloadUrl, '_blank');
            }
        }

        function goBack() {
            if (!currentPath) {
                // If at root of a repo, go back to repo list
                fetchRepositories();
            } else {
                // Go to parent directory
                const parts = currentPath.split('/');
                parts.pop();
                const newPath = parts.join('/');
                fetchRepoContents(newPath);
            }
        }

        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            
            // Base: Link to User Repos
            let html = `<a href="#" onclick="fetchRepositories(); return false;">${REPO_OWNER}</a>`;
            
            if (currentRepo) {
                // Add Repo Name
                html += ` / <a href="#" onclick="enterRepo('${currentRepo}','',''); return false;">${currentRepo}</a>`;
                
                // Add Path parts
                if (currentPath) {
                    const parts = currentPath.split('/');
                    let buildPath = '';
                    parts.forEach((part) => {
                        buildPath += (buildPath ? '/' : '') + part;
                        // Closure issue fix: string interpolation ensures value is frozen
                        html += ` / <a href="#" onclick="fetchRepoContents('${buildPath}'); return false;">${part}</a>`;
                    });
                }
            }
            
            breadcrumb.innerHTML = html;
        }

        // Icons
        function getRepoIcon() {
            return `
                <svg class="file-icon" viewBox="0 0 16 16" fill="currentColor">
                     <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75
